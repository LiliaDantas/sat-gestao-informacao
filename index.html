<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Secgeral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<script type="text/css" id="app-css">/* ===================================================================
   SAT · Painel de Projetos — design tokens
   Color: institutional wine/burgundy on a warm sage-tinted neutral ground.
   Type:  Source Serif 4 (display) + Public Sans (UI/body) + IBM Plex Mono (data)
   =================================================================== */

:root{
  --bg:#F4F5F0;
  --surface:#FFFFFF;
  --surface-2:#EAEDE4;
  --surface-3:#DEE2D5;
  --border:#D7DBCD;
  --border-strong:#C2C8B7;
  --ink:#16231F;
  --ink-2:#45524B;
  --ink-muted:#75816F;
  --accent:#7A2438;
  --accent-strong:#5E1B2B;
  --accent-ink:#FBF1F2;
  --accent-soft:#F4E1E4;
  --accent-soft-ink:#6B1F30;
  --good:#2E7D53;      --good-soft:#DEEFE2;      --good-ink:#1B5236;
  --warn:#B7791F;      --warn-soft:#F5E7CD;      --warn-ink:#7A5313;
  --critical:#B23B3B;  --critical-soft:#F6DEDE;  --critical-ink:#7A2727;
  --info:#3B6FA0;      --info-soft:#DCE8F2;      --info-ink:#274B6B;
  --neutral:#66716A;   --neutral-soft:#E7E9E1;   --neutral-ink:#454E48;
  --sidebar-bg:#8B0000; --sidebar-ink:#FAEEF0;
  --sat:#2F9BD6;    --sat-soft:#DCF0FA;    --sat-ink:#1B5E82;
  --orgao:#009B3A;  --orgao-soft:#DAF3E3;  --orgao-ink:#00722B;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 1px 1px rgba(20,30,25,.04);
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --font-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body:"Public Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613;
    --surface:#142019;
    --surface-2:#1A2820;
    --surface-3:#233327;
    --border:#2B3C31;
    --border-strong:#374B3D;
    --ink:#EAF2EC;
    --ink-2:#C1CDC5;
    --ink-muted:#8AA098;
    --accent:#D98A9A;
    --accent-strong:#E6A3B1;
    --accent-ink:#2B0D13;
    --accent-soft:#3A1820;
    --accent-soft-ink:#E7AEB8;
    --good:#57B786;      --good-soft:#173829;      --good-ink:#9BE0BC;
    --warn:#E0AC55;      --warn-soft:#3A2C13;      --warn-ink:#F0C989;
    --critical:#E2827C;  --critical-soft:#3A1E1C;  --critical-ink:#F3ADA8;
    --info:#7FAEDD;      --info-soft:#182B3C;      --info-ink:#AECBEC;
    --neutral:#9CA89F;   --neutral-soft:#212D25;   --neutral-ink:#B7C1BA;
    --sidebar-bg:#380000; --sidebar-ink:#F1DFE1;
    --sat:#6FBEE8; --sat-soft:#132C3A; --sat-ink:#9ED4EF;
    --orgao:#4CC583; --orgao-soft:#0F2A1B; --orgao-ink:#7FDDA8;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#142019; --surface-2:#1A2820; --surface-3:#233327;
  --border:#2B3C31; --border-strong:#374B3D;
  --ink:#EAF2EC; --ink-2:#C1CDC5; --ink-muted:#8AA098;
  --accent:#D98A9A; --accent-strong:#E6A3B1; --accent-ink:#2B0D13; --accent-soft:#3A1820; --accent-soft-ink:#E7AEB8;
  --good:#57B786; --good-soft:#173829; --good-ink:#9BE0BC;
  --warn:#E0AC55; --warn-soft:#3A2C13; --warn-ink:#F0C989;
  --critical:#E2827C; --critical-soft:#3A1E1C; --critical-ink:#F3ADA8;
  --info:#7FAEDD; --info-soft:#182B3C; --info-ink:#AECBEC;
  --neutral:#9CA89F; --neutral-soft:#212D25; --neutral-ink:#B7C1BA;
  --sidebar-bg:#1A0000; --sidebar-ink:#EFDFE1;
  --sat:#6FBEE8; --sat-soft:#132C3A; --sat-ink:#9ED4EF;
  --orgao:#4CC583; --orgao-soft:#0F2A1B; --orgao-ink:#7FDDA8;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--sidebar-bg); text-wrap:balance; }
p{ margin:0 0 .6em; }
a{ color:var(--accent); }
::selection{ background:var(--accent-soft); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.tnum{ font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

/* ---------- layout shell ---------- */
#root{ display:flex; min-height:100vh; }
.sidebar{
  width:232px; flex:0 0 232px; background:var(--sidebar-bg); color:var(--sidebar-ink);
  display:flex; flex-direction:column; padding:22px 16px; gap:24px; position:sticky; top:0; height:100vh;
}
.brand{ display:flex; flex-direction:column; gap:4px; padding:0 6px; }
.brand-row{ display:flex; align-items:center; gap:10px; }
.brand-crest{ width:40px; height:40px; flex:0 0 auto; object-fit:contain; }
.brand .mark{ font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.01em; color:var(--sidebar-ink); }
.brand .sub{ display:block; font-size:11.5px; color:var(--sidebar-ink); opacity:.65; letter-spacing:.03em; line-height:1.4; }
.brand .sub-2{ opacity:.5; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-s);
  color:var(--sidebar-ink); opacity:.8; cursor:pointer; font-size:14px; font-weight:500; border:none; background:none;
  text-align:left; width:100%;
}
.nav-item .ic{ width:17px; text-align:center; flex:0 0 auto; }
.nav-item:hover{ background:rgba(255,255,255,.08); opacity:1; }
.nav-item.active{ background:rgba(255,255,255,.14); opacity:1; }
.nav-count{ margin-left:auto; background:rgba(255,255,255,.22); color:var(--sidebar-ink); font-size:11px;
  font-weight:700; border-radius:999px; padding:1px 7px; }
.sidebar-foot{ margin-top:auto; padding:0 6px; font-size:11.5px; color:var(--sidebar-ink); opacity:.62; line-height:1.5; }
.sidebar-foot .rw-badge{ display:inline-flex; align-items:center; gap:5px; opacity:1; margin-bottom:6px; }
.dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
.dot.ok{ background:#7ED0B4; } .dot.warn{ background:#E0AC55; }

.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5;
}
.topbar h1{ font-size:20px; }
.topbar .crumb{ font-size:12.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }
.view{ padding:24px 28px 64px; max-width:1240px; width:100%; margin:0 auto; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }

/* ---------- buttons & inputs ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-s);
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600;
  cursor:pointer; white-space:nowrap; line-height:1.2;
}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ color:var(--critical); }
.btn-sm{ padding:5px 10px; font-size:12.5px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn-icon{ padding:7px 9px; }

.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.field-row{ display:flex; gap:14px; flex-wrap:wrap; }
.field-row > .field{ flex:1 1 200px; }
label{ font-size:12.5px; font-weight:600; color:var(--ink-2); }
label .opt{ font-weight:400; color:var(--ink-muted); }
.input,.select,.textarea{
  font-family:inherit; font-size:14px; padding:8px 10px; border-radius:var(--radius-s);
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); width:100%;
}
.input:focus,.select:focus,.textarea:focus{ border-color:var(--accent); }
.textarea{ resize:vertical; min-height:76px; font-family:inherit; }
.hint{ font-size:12px; color:var(--ink-muted); }
.search-box{ position:relative; }
.search-box input{ padding-left:30px; }
.search-box .ic{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-muted); font-size:13px; }

/* ---------- cards / sections ---------- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px 22px; }
.card + .card{ margin-top:16px; }
.section-title{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.section-title h2{ font-size:17px; }
.section-title .desc{ font-size:12.5px; color:var(--ink-muted); }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media (max-width:880px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

/* ---------- KPI ---------- */
.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.kpi{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
.kpi .num{ font-family:var(--font-display); font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
.kpi .lbl{ font-size:12px; color:var(--ink-muted); font-weight:500; }
.kpi.accent .num{ color:var(--accent); }
.kpi.warn .num{ color:var(--warn); }
.kpi.critical .num{ color:var(--critical); }
.kpi.clickable{ cursor:pointer; }
.kpi.clickable:hover{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.kpi-painel .kpi{ background:#CDC9C9; border-color:#B9B4B4; }

/* ---------- pills / status ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px;
  font-size:11.5px; font-weight:600; white-space:nowrap; line-height:1.5;
}
.pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.fam-accent{ background:var(--accent-soft); color:var(--accent-soft-ink); }
.pill.fam-info{ background:var(--info-soft); color:var(--info-ink); }
.pill.fam-warn{ background:var(--warn-soft); color:var(--warn-ink); }
.pill.fam-neutral{ background:var(--neutral-soft); color:var(--neutral-ink); }
.pill.fam-good{ background:var(--good-soft); color:var(--good-ink); }
.pill.fam-critical{ background:var(--critical-soft); color:var(--critical-ink); }
.pill-select{
  appearance:none; -webkit-appearance:none; -moz-appearance:none; border:none; cursor:pointer;
  display:inline-flex; align-items:center; padding:3px 22px 3px 10px; border-radius:99px;
  font-size:11.5px; font-weight:600; white-space:nowrap; line-height:1.5; font-family:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23666'/></svg>");
  background-repeat:no-repeat; background-position:right 8px center;
}
.pill-select.fam-accent{ background-color:var(--accent-soft); color:var(--accent-soft-ink); }
.pill-select.fam-info{ background-color:var(--info-soft); color:var(--info-ink); }
.pill-select.fam-warn{ background-color:var(--warn-soft); color:var(--warn-ink); }
.pill-select.fam-neutral{ background-color:var(--neutral-soft); color:var(--neutral-ink); }
.pill-select.fam-good{ background-color:var(--good-soft); color:var(--good-ink); }
.pill-select.fam-critical{ background-color:var(--critical-soft); color:var(--critical-ink); }
.round-icon-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  color:var(--accent); font-size:19px; font-weight:700; cursor:pointer; display:inline-flex;
  align-items:center; justify-content:center; line-height:1; padding:0;
}
.round-icon-btn:hover{ background:var(--accent-soft); }
.despacho-jump{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:5; }
.despacho-section-title{ margin:28px 0 14px; scroll-margin-top:54px; padding-bottom:8px; border-bottom:2px solid var(--sidebar-bg); }
.despacho-section-title:first-of-type{ margin-top:0; }
.tag-sat{ background:var(--sat-soft); color:var(--sat-ink); }
.tag-orgao{ background:var(--orgao-soft); color:var(--orgao-ink); }
.cal-chip.enc-sat{ background:var(--sat-soft); color:var(--sat-ink); }
.cal-chip.enc-orgao{ background:var(--orgao-soft); color:var(--orgao-ink); }
.filtro-row{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:12px; margin-bottom:14px; }
.textarea-principal{ background:var(--accent-soft); border-color:var(--accent-soft-ink); }
.tag{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); font-size:11.5px; font-weight:600; }
.flag-review{ color:var(--warn); font-size:12px; font-weight:700; }
.checkbox-cell{ width:36px; text-align:center; }
input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; vertical-align:middle; }

/* ---------- table ---------- */
.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-m); }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
thead th{
  position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11.5px; text-transform:uppercase;
  letter-spacing:.04em; color:var(--ink-muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--ink-2); }
tbody tr:last-child td{ border-bottom:none; }
tbody tr.clickable{ cursor:pointer; }
tbody tr.clickable:hover{ background:var(--surface-2); }
td.strong{ color:var(--ink); font-weight:600; }
.filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.filter-bar .field{ margin-bottom:0; min-width:150px; }
.empty-state{ text-align:center; padding:48px 20px; color:var(--ink-muted); }
.empty-state .big{ font-size:28px; margin-bottom:6px; }

/* ---------- tabs ---------- */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.tab{ padding:9px 4px; margin-right:18px; border:none; background:none; font-size:13.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab.active{ color:var(--accent); border-bottom-color:var(--accent); }

/* ---------- timeline (atualizações) ---------- */
.timeline{ display:flex; flex-direction:column; gap:0; }
.tl-item{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.tl-item:last-child{ border-bottom:none; }
.tl-dot{ flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:6px; }
.tl-body{ flex:1; min-width:0; }
.tl-meta{ display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ink-muted); margin-bottom:3px; flex-wrap:wrap; }
.tl-author{ font-weight:700; color:var(--ink-2); }
.tl-author-line{ display:block; font-size:12px; font-weight:600; margin-bottom:3px; }
.tl-text{ white-space:pre-wrap; color:var(--ink); font-size:13.8px; line-height:1.55; }
.tl-origin{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); border:1px solid var(--border); border-radius:4px; padding:1px 5px; }

/* ---------- modal ---------- */
.modal-backdrop{ position:fixed; inset:0; background:rgba(15,20,17,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
.modal{ background:var(--surface); border-radius:var(--radius-l); width:100%; max-width:640px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
.modal.wide{ max-width:820px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
.modal-head h3{ font-size:17px; }
.modal-body{ padding:20px 22px; max-height:70vh; overflow-y:auto; }
.modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); }

/* ---------- toast ---------- */
#toast-root{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:100; max-width:340px; }
.toast{ background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:var(--radius-s); font-size:13px; box-shadow:var(--shadow); }
.toast.err{ background:var(--critical); color:#fff; }
.toast.ok{ background:var(--good); color:#fff; }

/* ---------- readonly banner ---------- */
.banner{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:var(--radius-m); font-size:13px; margin-bottom:16px; }
.banner.warn{ background:var(--warn-soft); color:var(--warn-ink); }
.banner.info{ background:var(--info-soft); color:var(--info-ink); }

/* ---------- charts ---------- */
.barchart{ display:flex; flex-direction:column; gap:9px; }
.barrow{ display:grid; grid-template-columns:150px 1fr 42px; gap:10px; align-items:center; }
.barrow .lbl{ font-size:12.5px; color:var(--ink-2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.barrow .track{ background:var(--surface-2); border-radius:4px; height:14px; overflow:hidden; }
.barrow .fill{ height:100%; border-radius:4px; }
.barrow .val{ font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
.legend{ display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--ink-2); margin-top:10px; }
.legend .li{ display:flex; align-items:center; gap:6px; }
.legend .sw{ width:9px; height:9px; border-radius:2px; }

/* ---------- calendar ---------- */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-card{ border:2px solid var(--sidebar-bg); padding:0; overflow:hidden; }
.cal-card-head{ background:var(--sidebar-bg); color:var(--sidebar-ink); display:flex; align-items:center; justify-content:space-between; padding:14px 20px; margin-bottom:0; }
.cal-card-head h2{ color:var(--sidebar-ink); }
.cal-card-head .icon-btn{ color:var(--sidebar-ink); border-color:rgba(255,255,255,.35); }
.cal-card-head .icon-btn:hover{ background:rgba(255,255,255,.12); }
.cal-card-body{ padding:20px 22px; }
.cal-dow{ font-size:11px; text-transform:uppercase; color:var(--ink-muted); text-align:center; padding-bottom:4px; letter-spacing:.04em; }
.cal-cell{ min-height:76px; border:1px solid var(--border); border-radius:var(--radius-s); padding:6px; background:var(--surface); display:flex; flex-direction:column; gap:3px; }
.cal-cell.pad{ background:transparent; border-color:transparent; }
.cal-cell.today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.cal-daynum{ font-size:11.5px; font-weight:700; color:var(--ink-muted); }
.cal-cell.today .cal-daynum{ color:var(--accent); }
.cal-chip{ font-size:10.5px; padding:2px 5px; border-radius:4px; background:var(--accent-soft); color:var(--accent-soft-ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.cal-chip.enc{ background:var(--info-soft); color:var(--info-ink); }
.cal-chip.late{ background:var(--critical-soft); color:var(--critical-ink); }
.cal-chip.done{ background:var(--good-soft); color:var(--good-ink); }

/* ---------- scatter (impacto x esforço) ---------- */
.scatter-wrap{ overflow-x:auto; }
.scatter-pt{ cursor:pointer; }
.scatter-pt circle{ transition:r .1s; }
.scatter-pt:hover circle{ r:7; }
.q-label{ font-size:11px; fill:var(--ink-muted); font-family:var(--font-body); }

/* misc */
.muted{ color:var(--ink-muted); }
.right{ text-align:right; }
.flex{ display:flex; align-items:center; }
.gap8{ gap:8px; } .gap6{ gap:6px; } .gap12{ gap:12px; }
.spacer{ flex:1; }
hr.sep{ border:none; border-top:1px solid var(--border); margin:16px 0; }
.small{ font-size:12px; }
.link-btn{ background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:0; font-size:inherit; }
.icon-btn{ background:none; border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 7px; cursor:pointer; color:var(--ink-2); }
.icon-btn:hover{ background:var(--surface-2); }
.weight-note{ background:var(--surface-2); border-radius:var(--radius-s); padding:10px 12px; font-size:12px; color:var(--ink-2); }
@media (max-width:760px){
  .sidebar{ display:none; }
  .view{ padding:18px 14px 48px; }
  .topbar{ padding:14px 16px; }
}

/* ---------- red table headers (Projetos / Briefings) ---------- */
.tbl-red thead th{ background:#8B0000; color:#fff; }

/* ---------- inline row expansion (accordion) ---------- */
.expand-row td{ background:var(--surface-2); padding:0; border-bottom:1px solid var(--border); }
.expand-panel{ padding:16px 18px; }
.expand-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); font-weight:600; margin-bottom:6px; }

/* ---------- home ---------- */
.home-sub{ color:var(--ink-muted); font-size:14.5px; margin-bottom:20px; }
.home-section-title{ font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--accent); margin:28px 0 14px; }
.shortcut-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
.shortcut-card{
  display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px 18px;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.shortcut-card:hover{ border-color:var(--accent); box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
.shortcut-ic{ width:42px; height:42px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:19px; }
.shortcut-title{ font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--ink); }
.shortcut-desc{ font-size:12.5px; color:var(--ink-muted); line-height:1.4; }

/* ---------- segmented toggle (registrar atualização: projeto/briefing) ---------- */
.seg-toggle{ display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-m); overflow:hidden; }
.seg-btn{ padding:8px 16px; border:none; background:var(--surface); color:var(--ink-2); font-size:13px; font-weight:600; cursor:pointer; }
.seg-btn.active{ background:var(--accent); color:var(--accent-ink); }
.seg-btn+.seg-btn{ border-left:1px solid var(--border); }
</script>

function sbList(table){
  return fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=*", { headers: authHeaders() })
    .then(function(res){ if(res.status===401){ sbLogout(); throw new Error("sessão expirada"); } if(!res.ok) throw new Error("Falha ao carregar " + table); return res.json(); });
}
function sbInsert(table, row){
  return fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: Object.assign({}, authHeaders(), { "Content-Type": "application/json", Prefer: "return=minimal" }),
    body: JSON.stringify(row)
  }).then(function(res){ if(res.status===401){ sbLogout(); } if(!res.ok) return res.text().then(function(t){ throw new Error(t); }); });
}
function sbUpdate(table, id, row){
  return fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), {
    method: "PATCH",
    headers: Object.assign({}, authHeaders(), { "Content-Type": "application/json", Prefer: "return=minimal" }),
    body: JSON.stringify(row)
  }).then(function(res){ if(res.status===401){ sbLogout(); } if(!res.ok) return res.text().then(function(t){ throw new Error(t); }); });
}
function sbDelete(table, id){
  return fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), {
    method: "DELETE", headers: authHeaders()
  }).then(function(res){ if(res.status===401){ sbLogout(); } if(!res.ok) return res.text().then(function(t){ throw new Error(t); }); });
}
function sbFail(msg){
  return function(err){ toast(msg + (err && err.message ? (": " + err.message) : ""), "err"); };
}

var SB_SESSION = null; // {access_token, email}
function authHeaders(){
  var token = SB_SESSION ? SB_SESSION.access_token : SUPABASE_ANON_KEY;
  return { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + token };
}
function sbLogin(email, senha){
  return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: senha })
  }).then(function(res){
    return res.json().then(function(data){
      if(!res.ok) throw new Error(data.error_description || data.msg || "E-mail ou senha inválidos.");
      return data;
    });
  });
}
function sbLogout(){
  SB_SESSION = null;
  try{ sessionStorage.removeItem('sat_session'); }catch(e){}
  DB = null;
  paintLogin();
}
function saveSession(data){
  SB_SESSION = { access_token: data.access_token, email: data.user && data.user.email };
  try{ sessionStorage.setItem('sat_session', JSON.stringify(SB_SESSION)); }catch(e){}
}
function restoreSession(){
  try{
    var raw = sessionStorage.getItem('sat_session');
    if(raw){ SB_SESSION = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}
function deriveMeta(projetos){
  var orgaos = {}, responsaveis = {}, status = {};
  projetos.forEach(function(p){
    if(p.orgao) orgaos[p.orgao] = true;
    if(p.responsavel) responsaveis[p.responsavel] = true;
    if(p.status) status[p.status] = true;
  });
  return { orgaos: Object.keys(orgaos).sort(), responsaveis: Object.keys(responsaveis).sort(),
    status: Object.keys(status).sort(), origemBoard:"SAT Secgeral", importadoEm:null };
}

/* ---------------------------------------------------------------- utils */
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mdLite(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return null; var d=new Date(iso); if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now()-d.getTime())/86400000); }
function nowIso(){ return new Date().toISOString(); }
function toDateInputVal(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return '';
  var m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2); return d.getFullYear()+'-'+m+'-'+day; }
function fromDateInputVal(v){ if(!v) return null; return new Date(v+'T12:00:00').toISOString(); }
function initials(name){ if(!name) return '??'; var parts=name.trim().split(/\s+/); if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase(); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function numOrNull(v){ if(v===''||v===null||v===undefined) return null; var n=Number(v); return isNaN(n)?null:n; }

var STATUS_FAMILY = {
  'Em andamento':'accent','Acompanhamento Periódico':'info','Ciência/Acompanhamento':'info',
  'Demanda pontual':'info','Aguarda orientação':'warn','Aguardando retorno':'warn',
  'Ponto para definição':'warn','Alinhar condução':'warn','Pausado':'neutral',
  'Arquivado':'good','Sem status definido':'neutral'
};
function statusPill(status){
  var s = status||'Sem status definido';
  var fam = STATUS_FAMILY[s] || 'neutral';
  return '<span class="pill fam-'+fam+'">'+esc(s)+'</span>';
}
function statusSelect(p){
  var s = p.status||'Sem status definido';
  var fam = STATUS_FAMILY[s] || 'neutral';

var IMPACT_W = {alcance:1, valor:4, urgencia:2}, IMPACT_SUM = 7;
var EFFORT_W = {complexidade:1, dependencias:2, incerteza:1}, EFFORT_SUM = 4;
function scoreImpacto(imp){ if(!imp) return null; var a=imp.alcance,v=imp.valor,u=imp.urgencia;
  if(a==null||v==null||u==null) return null; return (a*IMPACT_W.alcance+v*IMPACT_W.valor+u*IMPACT_W.urgencia)/IMPACT_SUM; }
function scoreEsforco(esf){ if(!esf) return null; var c=esf.complexidade,d=esf.dependencias,i=esf.incerteza;
  if(c==null||d==null||i==null) return null; return (c*EFFORT_W.complexidade+d*EFFORT_W.dependencias+i*EFFORT_W.incerteza)/EFFORT_SUM; }

function normalizeDB(){
  DB.projetos.forEach(function(p){
    if(!p.impacto) p.impacto = {alcance:null,valor:null,urgencia:null};
    if(!p.esforco) p.esforco = {complexidade:null,dependencias:null,incerteza:null};
    if(p.revisarCadastro===undefined) p.revisarCadastro=false;
  });
  if(!DB.meta) DB.meta = {orgaos:[],responsaveis:[],status:[]};
  if(!DB.marcos) DB.marcos = [];
  DB.marcos.forEach(function(m){ if(!m.tipo) m.tipo='marco'; });
  if(!DB.despachoSelecionados) DB.despachoSelecionados = [];
  if(DB.despachoPauta==null) DB.despachoPauta = '';
  if(!DB.briefings) DB.briefings = [];
  DB.atualizacoes.forEach(function(a){ if(!a.alvoTipo) a.alvoTipo='projeto'; });
}

function guessFileNameFromUrl(url){
  if(!url) return '';
  try{
    var clean = url.split('?')[0].split('#')[0];
    var parts = clean.split('/').filter(Boolean);
    var last = parts.length ? decodeURIComponent(parts[parts.length-1]) : '';
    return last || url;
  }catch(e){ return url; }
}

  atual30:'Projetos atualizados nos últimos 30 dias', entregas7:'Projetos com entregas nos próximos 7 dias',
  atrasadas:'Projetos com entregas em atraso', sem60:'Projetos sem atualização há mais de 60 dias'
};
function getKpiProjetos(kind){
  var ids = [];
  if(kind==='ativos'){ ids = projetosAtivos().map(function(p){return p.id;}); }
  else if(kind==='encerrados'){ ids = DB.projetos.filter(function(p){return p.encerrado;}).map(function(p){return p.id;}); }
  else if(kind==='atual30'){
    var cutoff = Date.now() - 30*86400000;
    var set = {};
    DB.atualizacoes.forEach(function(a){ if(new Date(a.data).getTime()>=cutoff) set[a.projetoId]=true; });
    ids = Object.keys(set);
  } else if(kind==='entregas7'){
    var set2 = {};
    DB.marcos.forEach(function(m){ if(!m.dataPrevista||m.status==='concluído') return;
      var days=(new Date(m.dataPrevista)-Date.now())/86400000; if(days>=0&&days<=7) set2[m.projetoId]=true; });
    ids = Object.keys(set2);
  } else if(kind==='atrasadas'){
    var set3 = {};
    DB.marcos.filter(isMarcoAtrasado).forEach(function(m){ set3[m.projetoId]=true; });
    ids = Object.keys(set3);
  } else if(kind==='sem60'){
    ids = projetosAtivos().filter(function(p){ var d=daysSince(p.dataUltimaAtualizacao); return d!==null && d>60; }).map(function(p){return p.id;});
  }
  return ids.map(getProjeto).filter(Boolean).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
}

  var f = UI.filtros;
  return DB.projetos.filter(function(p){
    if(!f.encerrados && p.encerrado) return false;
    if(f.orgao && p.orgao!==f.orgao) return false;
    if(f.responsavel && p.responsavel!==f.responsavel) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.q){
      var q = f.q.toLowerCase();
      var hay = (p.nome+' '+(p.processoSei||'')+' '+(p.resumo||'')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return new Date(b.dataUltimaAtualizacao||0) - new Date(a.dataUltimaAtualizacao||0); });
}
function selectOptions(list, current, allLabel){
  var out = '<option value="">'+esc(allLabel||'Todos')+'</option>';
  list.forEach(function(v){ out += '<option value="'+esc(v)+'"'+(v===current?' selected':'')+'>'+esc(v)+'</option>'; });
  return out;
}

/* -------------------------------------------------------------- calendário */
function monthLabel(y,m){ var s = new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function renderCalendario(){
  var parts = UI.calMonth.split('-'); var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
  var first = new Date(y,m,1);
  var startDow = first.getDay();
  var daysInMonth = new Date(y,m+1,0).getDate();
  var today = new Date(); today.setHours(0,0,0,0);
  var byDay = {};
  DB.marcos.forEach(function(mk){ if(!mk.dataPrevista) return; var key = mk.dataPrevista.slice(0,10); (byDay[key]=byDay[key]||[]).push(mk); });
  var cells = '';
  for(var i=0;i<startDow;i++) cells += '<div class="cal-cell pad"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var dateObj = new Date(y,m,d); var key = dateObj.toISOString().slice(0,10);
    var isToday = dateObj.getTime()===today.getTime();
    var items = (byDay[key]||[]).map(function(mk){
      var p = getProjeto(mk.projetoId); var late = isMarcoAtrasado(mk);
      var cls = mk.status==='concluído'?'done':(late?'late':
        (mk.tipo==='encaminhamento-sat'?'enc-sat':(mk.tipo==='encaminhamento-orgao'?'enc-orgao':(mk.tipo==='encaminhamento'?'enc':''))));
      var kindLbl = mk.tipo==='encaminhamento-sat'?'Encaminhamento SAT':(mk.tipo==='encaminhamento-orgao'?'Encaminhamento Órgão':(mk.tipo==='encaminhamento'?'Encaminhamento':'Entrega'));
      return '<div class="cal-chip '+cls+'" data-action="open-projeto" data-id="'+esc(mk.projetoId)+'" title="'+kindLbl+': '+esc(mk.descricao)+' — '+esc(p?p.nome:'')+'">'+esc(mk.descricao)+'</div>';
    }).join('');
    cells += '<div class="cal-cell'+(isToday?' today':'')+'"><div class="cal-daynum">'+d+'</div>'+items+'</div>';
  }
  var dow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(function(x){return '<div class="cal-dow">'+x+'</div>';}).join('');

  var atrasados = DB.marcos.filter(isMarcoAtrasado).sort(function(a,b){return new Date(a.dataPrevista)-new Date(b.dataPrevista);});
  var atrasadosHtml = atrasados.length ? atrasados.map(function(mk){ var p=getProjeto(mk.projetoId);
    return '<div class="tl-item"><div class="tl-dot" style="background:var(--critical)"></div><div class="tl-body">'+
      '<div class="tl-meta">'+fmtDate(mk.dataPrevista)+'</div><div class="tl-text"><strong>'+esc(mk.descricao)+'</strong> — '+
      '<button class="link-btn" data-action="open-projeto" data-id="'+esc(p?p.id:'')+'">'+esc(p?p.nome:'')+'</button></div></div></div>'; }).join('')
    : '<div class="empty-state small">Nenhuma entrega em atraso.</div>';

  return (
    '<div class="card cal-card">'+
      '<div class="cal-card-head"><button class="icon-btn" data-action="cal-prev">←</button>'+
        '<h2>'+monthLabel(y,m)+'</h2>'+
        '<button class="icon-btn" data-action="cal-next">→</button></div>'+
      '<div class="cal-card-body"><div class="cal-grid">'+dow+cells+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="section-title"><h2>Entregas em atraso</h2></div>'+atrasadosHtml+'</div>'
  );
}

function barChart(rows, opts){
  opts = opts||{};
  var max = Math.max.apply(null, rows.map(function(r){return r.value;}).concat([1]));
  return '<div class="barchart">'+rows.map(function(r){
    var pct = max? (r.value/max*100) : 0;
    return '<div class="barrow"><div class="lbl" title="'+esc(r.label)+'">'+esc(r.label)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+pct.toFixed(1)+'%;background:'+(r.color||'var(--accent)')+'"></div></div>'+
      '<div class="val">'+r.value+'</div></div>';
  }).join('')+'</div>';
}
function renderRelatorio(){
  var ativos = projetosAtivos();
  var atrasados = DB.marcos.filter(isMarcoAtrasado);

  var byOrgao = {}; DB.projetos.forEach(function(p){ var k=p.orgao||'—'; byOrgao[k]=(byOrgao[k]||0)+1; });
  var orgaoRows = Object.keys(byOrgao).map(function(k){return {org:k, count:byOrgao[k]};}).sort(function(a,b){return b.count-a.count;});

  var byOrgaoAtraso = {};
  atrasados.forEach(function(m){ var p=getProjeto(m.projetoId); var k=p?(p.orgao||'—'):'—'; byOrgaoAtraso[k]=(byOrgaoAtraso[k]||0)+1; });
  var atrasoRows = Object.keys(byOrgaoAtraso).map(function(k){return {org:k, count:byOrgaoAtraso[k]};}).sort(function(a,b){return b.count-a.count;});

  var revisarList = DB.projetos.filter(function(p){return p.revisarCadastro;});
  var revisarHtml = revisarList.length ? '<div class="table-wrap" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>Projeto</th><th>Órgão</th><th>Status atual</th><th></th></tr></thead><tbody>'+
    revisarList.map(function(p){ return '<tr><td class="strong">'+esc(p.nome)+'</td><td>'+esc(p.orgao||'—')+'</td><td>'+statusPill(p.status)+'</td>'+
      '<td class="right"><button class="btn btn-sm" data-action="open-projeto" data-id="'+p.id+'">Abrir</button></td></tr>'; }).join('')+'</tbody></table></div>'
    : '<div class="empty-state small">Nada pendente de revisão.</div>';

  function orgTable(rows, colLabel, emptyMsg){
    if(!rows.length) return '<div class="empty-state small">'+emptyMsg+'</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Órgão</th><th class="right">'+colLabel+'</th></tr></thead><tbody>'+
      rows.map(function(r){ return '<tr><td class="strong">'+esc(r.org)+'</td><td class="right tnum">'+r.count+'</td></tr>'; }).join('')+
      '</tbody></table></div>';
  }

  return (
    '<div class="kpi-grid">'+
      kpi(DB.projetos.length,'Total de projetos','')+
      kpi(ativos.length,'Ativos','accent')+
      kpi(atrasados.length,'Entregas atrasadas', atrasados.length>0?'critical':'')+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="section-title"><h2>Cadastros migrados que precisam de revisão</h2>'+
      '<span class="desc">status não identificado ou ambíguo na importação original</span></div>'+revisarHtml+'</div>'+
    '<div class="card" style="margin-top:16px"><div class="section-title"><h2>Projetos por órgão</h2>'+
      '<span class="desc"><button class="btn btn-sm" data-action="export-csv">Exportar CSV de projetos</button></span></div>'+
      orgTable(orgaoRows,'Projetos','Nenhum projeto cadastrado.')+'</div>'
  );
}
function exportProjetosCsv(){
  var cols = ['nome','orgao','responsavel','status','processoSei','autoridade','dataCriacao','dataUltimaAtualizacao','encerrado'];
  var lines = [cols.join(';')];
  DB.projetos.forEach(function(p){
    lines.push(cols.map(function(c){ var v=p[c]; if(v==null) v=''; v=String(v).replace(/"/g,'""'); return /[;"\n]/.test(v)?'"'+v+'"':v; }).join(';'));
  });
  return lines.join('\r\n');
}

  var mode = data.mode||'create';
  var m = mode==='edit' ? DB.marcos.filter(function(x){return x.id===data.id;})[0] : null;
  if(mode==='edit' && !m) return '';
  var projetoId = mode==='edit' ? m.projetoId : (data.projetoId||'');
  var showProjetoSelect = !data.projetoId || mode==='edit';
  var opts = DB.projetos.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');})
    .map(function(p){ return '<option value="'+p.id+'"'+(p.id===projetoId?' selected':'')+'>'+esc(p.nome)+'</option>'; }).join('');
  var tipo = mode==='edit' ? (m.tipo||'marco') : (data.tipo||'marco');
  var statusOpts = MARCO_STATUS.filter(function(s){return s!=='atrasado';}).map(function(s){
    return '<option value="'+s+'"'+(mode==='edit'&&m.status===s?' selected':'')+'>'+s+'</option>'; }).join('');
  return '<div class="modal" data-stop="1"><div class="modal-head"><h3>'+(mode==='edit'?'Editar':'Nova')+' entrega / encaminhamento</h3>'+
    '<button class="icon-btn" data-action="close-modal">✕</button></div>'+
    '<form data-form="'+(mode==='edit'?'editar-marco':'novo-marco-form')+'"'+(mode==='edit'?' data-id="'+m.id+'"':'')+'><div class="modal-body">'+
    (showProjetoSelect ? '<div class="field"><label>Projeto</label><select class="select" name="projetoId" required data-autofocus><option value="">Selecione…</option>'+opts+'</select></div>' : '')+
    '<div class="field"><label>Tipo</label><select class="select" name="tipo">'+
      '<option value="marco"'+(tipo==='marco'?' selected':'')+'>Entrega/marco</option>'+
      '<option value="encaminhamento"'+(tipo==='encaminhamento'?' selected':'')+'>Encaminhamento</option></select></div>'+
    '<div class="field"><label>Descrição</label><input class="input" name="descricao" value="'+esc(mode==='edit'?m.descricao:'')+'" placeholder="Ex.: Ordem de início de obra" required'+(showProjetoSelect?'':' data-autofocus')+'></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Data prevista</label><input class="input" type="date" name="dataPrevista" value="'+toDateInputVal(mode==='edit'?m.dataPrevista:'')+'" required></div>'+
      (mode==='edit' ? '<div class="field"><label>Data realizada <span class="opt">opcional</span></label><input class="input" type="date" name="dataRealizada" value="'+toDateInputVal(m.dataRealizada)+'"></div>' : '')+
    '</div>'+
    (mode==='edit' ? '<div class="field"><label>Status</label><select class="select" name="status">'+statusOpts+'</select></div>' : '')+
    '</div><div class="modal-foot">'+
    (mode==='edit' ? '<button type="button" class="btn btn-ghost btn-danger" data-action="del-marco" data-id="'+m.id+'" style="margin-right:auto">Remover</button>' : '')+
    '<button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>'+
    '<button type="submit" class="btn btn-primary">'+(mode==='edit'?'Salvar':'Adicionar')+'</button></div></form></div>';
}

/* ------------------------------------------------------------------ events */
function wireEvents(){
  document.body.addEventListener('click', function(e){
    if(e.target.closest('[data-stop]')) { /* clicks inside modal card don't close it */ }
    var backdrop = e.target.closest('[data-action="backdrop-close"]');
    if(backdrop && e.target===backdrop){ closeModal(); return; }
    if(e.target.closest('[data-onchange="despacho-toggle"]')) return; /* checkbox inside a clickable row */
    var el = e.target.closest('[data-action]');
    if(!el) return;
    handleAction(el.dataset.action, el, e);
  });
  document.body.addEventListener('submit', function(e){
    var form = e.target.closest('form[data-form]');
    if(!form) return;
    e.preventDefault();
    handleFormSubmit(form.dataset.form, form);
  });
  document.body.addEventListener('change', function(e){
    var el = e.target.closest('[data-onchange]');
    if(el) handleChange(el.dataset.onchange, el);
    var sel = e.target.closest('select[name="autor"]');
    if(sel){
      var form = sel.closest('form');
      var box = form && form.querySelector('[data-autor-outro]');
      if(box) box.style.display = sel.value==='__outro__' ? 'block' : 'none';
    }
    var orgSel = e.target.closest('select[name="orgao"]');
    if(orgSel){
      var f2 = orgSel.closest('form');
      var box2 = f2 && f2.querySelector('[data-orgao-outro]');
      if(box2) box2.style.display = orgSel.value==='__outro__' ? 'block' : 'none';
    }
  });
}
function resolveAutor(form){
  var sel = form.querySelector('select[name="autor"]');
  if(!sel) return null;
  if(sel.value==='__outro__'){
    var v = (form.querySelector('[name="autorOutro"]')||{}).value || '';
    return v.trim() || null;
  }
  return sel.value || null;
}
function resolveOrgao(form){
  var sel = form.querySelector('select[name="orgao"]');
  if(!sel) return '';
  if(sel.value==='__outro__'){
    var v = (form.querySelector('[name="orgaoOutro"]')||{}).value || '';
    return v.trim();
  }
  return sel.value;
}

function handleAction(action, el, e){
  var id = el.dataset.id;
  if(action==='logout'){
    sbLogout();
    return;
  } else if(action==='nav'){
    UI.view = el.dataset.view;
    if(UI.view!=='projeto-detail') UI.selectedProjetoId = null;
    if(UI.view!=='briefing-detail') UI.selectedBriefingId = null;
    paint();
  } else if(action==='open-projeto'){
    if(!id) return;
    UI.modal = null;
    UI.view='projeto-detail'; UI.selectedProjetoId=id; UI.projetoTab='geral'; paint();
  } else if(action==='open-briefing'){
    if(!id) return;
    UI.modal = null;
    UI.view='briefing-detail'; UI.selectedBriefingId=id; paint();
  } else if(action==='new-briefing'){
    openModal('briefing-form', {mode:'create'});
  } else if(action==='edit-briefing'){
    openModal('briefing-form', {mode:'edit', id:id});
  } else if(action==='projeto-expand-toggle'){
    UI.projetoExpandidoId = (UI.projetoExpandidoId===id) ? null : id; paint();
  } else if(action==='briefing-expand-toggle'){
    UI.briefingExpandidoId = (UI.briefingExpandidoId===id) ? null : id; paint();
  } else if(action==='atual-tipo-set'){
    UI.atualTipoAlvo = el.dataset.tipo; paint();
  } else if(action==='kpi-drill'){
    openModal('kpi-list', {kind: el.dataset.kind});
  } else if(action==='projeto-tab'){
    UI.projetoTab = el.dataset.tab; paint();
  } else if(action==='new-projeto'){
    openModal('projeto-form', {mode:'create'});
  } else if(action==='edit-projeto'){
    openModal('projeto-form', {mode:'edit', id:id});
  } else if(action==='close-modal'){
    closeModal();
  } else if(action==='toggle-encerrado'){
    var p = getProjeto(id);
    mutate(function(){ updateProjeto(id, {encerrado: !p.encerrado}); });
  } else if(action==='del-atualizacao'){
    openModal('confirm', {message:'Remover esta atualização? Essa ação não pode ser desfeita.', kind:'atualizacao', id:id});
  } else if(action==='del-anexo'){
    openModal('confirm', {message:'Remover este anexo?', kind:'anexo', id:id});
  } else if(action==='del-marco'){
    openModal('confirm', {message:'Remover este marco?', kind:'marco', id:id});
  } else if(action==='marco-concluir'){
    mutate(function(){ updateMarco(id, {status:'concluído', dataRealizada: nowIso()}); });
  } else if(action==='edit-marco'){
    openModal('marco-form', {mode:'edit', id:id});
  } else if(action==='confirm-yes'){
    var kind = el.dataset.kind;
    mutate(function(){
      if(kind==='atualizacao') removeAtualizacao(id);
      else if(kind==='anexo') removeAnexo(id);
      else if(kind==='marco') removeMarco(id);
    });
    closeModal();
  } else if(action==='cal-prev' || action==='cal-next'){
    var parts = UI.calMonth.split('-'); var y=parseInt(parts[0],10), m=parseInt(parts[1],10)-1;
    m += action==='cal-next'?1:-1;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    UI.calMonth = y+'-'+(m+1); paint();
  } else if(action==='new-marco-global'){
    openModal('marco-form', {mode:'create'});
  } else if(action==='despacho-enc-toggle'){
    UI.despachoEncAberto[id] = !UI.despachoEncAberto[id]; paint();
  } else if(action==='despacho-atual-edit'){
    UI.despachoEditTexto[id] = true; paint();
  } else if(action==='despacho-atual-cancel'){
    UI.despachoEditTexto[id] = false; paint();
  } else if(action==='despacho-atual-save'){
    var atualId = el.dataset.atual;
    var ta = document.querySelector('[data-despacho-edit="'+id+'"]');
    var novoTexto = ta ? ta.value.trim() : '';
    if(!novoTexto) return;
    mutate(function(){
      updateAtualizacao(atualId, {texto: novoTexto});
      UI.despachoEditTexto[id] = false;
    });
    toast('Atualização editada.', 'ok');
  } else if(action==='despacho-remove'){
    mutate(function(){
      toggleDespachoSelecionado(id, false);
      delete UI.despachoEncAberto[id]; delete UI.despachoEditTexto[id];
    });
  } else if(action==='despacho-clear'){
    mutate(function(){
      DB.despachoSelecionados = [];
      UI.despachoEncAberto = {}; UI.despachoEditTexto = {};
    });
  } else if(action==='export-csv'){
    var csv = exportProjetosCsv();
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'projetos-sat.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Arquivo exportado.', 'ok');
  }
}
function handleChange(kind, el){
  if(kind==='filtro-q'){ UI.filtros.q = el.value; paint(); }
  else if(kind==='filtro-orgao'){ UI.filtros.orgao = el.value; paint(); }
  else if(kind==='filtro-responsavel'){ UI.filtros.responsavel = el.value; paint(); }
  else if(kind==='filtro-status'){ UI.filtros.status = el.value; paint(); }
  else if(kind==='filtro-encerrados'){ UI.filtros.encerrados = el.checked; paint(); }
  else if(kind==='atual-orgao-filtro'){
    var target = document.getElementById('atual-projeto-select');
    if(!target) return;
    var val = el.value;
    Array.prototype.forEach.call(target.options, function(opt){
      if(!opt.value){ opt.hidden = false; return; }
      opt.hidden = !!val && opt.dataset.orgao !== val;
    });
    if(target.selectedOptions[0] && target.selectedOptions[0].hidden){ target.value = ''; }
    syncUltimosRegistros('projeto', target.value || null);
  }
  else if(kind==='atual-projeto-mudou'){
    UI.selectedProjetoId = el.value || null;
    syncUltimosRegistros('projeto', el.value || null);
  }
  else if(kind==='atual-briefing-mudou'){
    UI.selectedBriefingId = el.value || null;
    syncUltimosRegistros('briefing', el.value || null);
  }
  else if(kind==='briefing-filtro-q'){
    UI.briefingFiltroQ = el.value; paint();
  }
  else if(kind==='despacho-toggle'){
    var pid = el.dataset.id, wasChecked = el.checked;
    mutate(function(){
      toggleDespachoSelecionado(pid, wasChecked);
      if(!wasChecked){ delete UI.despachoEncAberto[pid]; delete UI.despachoEditTexto[pid]; }
    });
  }
  else if(kind==='status-change'){
    var pidStatus = el.dataset.id, novoStatus = el.value;
    mutate(function(){ updateProjeto(pidStatus, {status: novoStatus}); });
    toast('Status atualizado.', 'ok');
  }
  else if(kind==='despacho-pauta'){
    mutate(function(){ setDespachoPauta(el.value); });
  }
}
function syncUltimosRegistros(tipo, alvoId){
  var wrap = document.getElementById('ultimos-registros-wrap');
  if(!wrap) return;
  wrap.innerHTML = renderUltimosRegistros(tipo, alvoId);
}

function handleFormSubmit(kind, form){
  var fd = new FormData(form);
  if(kind==='nova-atualizacao' || kind==='nova-atualizacao-global'){
    var isGlobal = kind==='nova-atualizacao-global';
    var tipoAlvo = isGlobal ? (fd.get('tipoAlvo')||'projeto') : (form.dataset.tipo||'projeto');
    var alvoId = isGlobal ? fd.get('alvoId') : form.dataset.projeto;
    var texto = (fd.get('texto')||'').toString().trim();
    if(!alvoId || !texto) return;
    var autor = resolveAutor(form);
    if(autor) setLastAutor(autor);
    var isProjeto = tipoAlvo==='projeto';
    var anexoLink = (isGlobal && isProjeto) ? (fd.get('anexoLink')||'').toString().trim() : '';
    var encTipo = (isGlobal && isProjeto) ? (fd.get('encTipo')||'sat') : null;
    var encData = (isGlobal && isProjeto) ? fromDateInputVal(fd.get('encData')) : null;
    var encTexto = (isGlobal && isProjeto) ? (fd.get('encTexto')||'').toString().trim() : '';
    if(isGlobal && isProjeto && ((encData && !encTexto) || (!encData && encTexto))){
      toast('Para registrar o encaminhamento, preencha a data e o conteúdo.', 'err');
      return;
    }
    mutate(function(){
      addAtualizacao(tipoAlvo, alvoId, texto, autor);
      if(anexoLink) addAnexo(alvoId, guessFileNameFromUrl(anexoLink), anexoLink, autor);
      if(encData && encTexto){
        var marcoTipo = encTipo==='orgao' ? 'encaminhamento-orgao' : 'encaminhamento-sat';
        addMarco(alvoId, encTexto, encData, 'previsto', marcoTipo);
        addAtualizacao(tipoAlvo, alvoId, encTexto, autor, marcoTipo);
      }
    });
    if(isGlobal) toast('Atualização registrada'+(anexoLink?' com anexo':'')+(encData&&encTexto?' e encaminhamento no calendário':'')+'.', 'ok');
  } else if(kind==='despacho-encaminhamento'){
    var pidEnc = form.dataset.projeto;
    var textoEnc = (fd.get('texto')||'').toString().trim();
    if(!pidEnc || !textoEnc) return;
    var autorEnc = SB_SESSION ? SB_SESSION.email : null;
    mutate(function(){
      addAtualizacao('projeto', pidEnc, textoEnc, autorEnc, 'encaminhamento');
      UI.despachoEncAberto[pidEnc] = false;
    });
    toast('Encaminhamento registrado no histórico do projeto.', 'ok');
  } else if(kind==='novo-anexo'){
    var pid = form.dataset.projeto;
    var nome = (fd.get('nomeArquivo')||'').toString().trim();
    var link = (fd.get('link')||'').toString().trim();
    if(!nome) return;
    var autorA = resolveAutor(form); if(autorA) setLastAutor(autorA);
    mutate(function(){ addAnexo(pid, nome, link, autorA); });
  } else if(kind==='novo-marco'){
    var pid2 = form.dataset.projeto;
    var desc = (fd.get('descricao')||'').toString().trim();
    var dp = fromDateInputVal(fd.get('dataPrevista'));
    if(!desc || !dp) return;
    mutate(function(){ addMarco(pid2, desc, dp, 'previsto'); });
  } else if(kind==='novo-marco-form'){
    var pid3 = fd.get('projetoId') || (UI.modal && UI.modal.data && UI.modal.data.projetoId);
    var desc2 = (fd.get('descricao')||'').toString().trim();
    var dp2 = fromDateInputVal(fd.get('dataPrevista'));
    var tipo2 = fd.get('tipo') || 'marco';
    if(!pid3 || !desc2 || !dp2) return;
    mutate(function(){ addMarco(pid3, desc2, dp2, 'previsto', tipo2); });
    toast(tipo2==='encaminhamento'?'Encaminhamento adicionado ao calendário.':'Entrega adicionada ao calendário.', 'ok');
    closeModal();
  } else if(kind==='editar-marco'){
    var mid = form.dataset.id;
    var descE = (fd.get('descricao')||'').toString().trim();
    var dpE = fromDateInputVal(fd.get('dataPrevista'));
    var drE = fromDateInputVal(fd.get('dataRealizada'));
    if(!descE || !dpE) return;
    mutate(function(){ updateMarco(mid, {
      descricao: descE, dataPrevista: dpE, dataRealizada: drE,
      status: fd.get('status')||'previsto', tipo: fd.get('tipo')||'marco'
    }); });
    toast('Entrega atualizada.', 'ok');
    closeModal();
  } else if(kind==='avaliacao'){
    var pid4 = form.dataset.projeto;
    var patch = {
      impacto: { alcance:numOrNull(fd.get('alcance')), valor:numOrNull(fd.get('valor')), urgencia:numOrNull(fd.get('urgencia')) },
      esforco: { complexidade:numOrNull(fd.get('complexidade')), dependencias:numOrNull(fd.get('dependencias')), incerteza:numOrNull(fd.get('incerteza')) }
    };
    mutate(function(){ updateProjeto(pid4, patch); });
    toast('Avaliação salva.', 'ok');
  } else if(kind==='novo-projeto' || kind==='editar-projeto'){
    var nome2 = (fd.get('nome')||'').toString().trim();
    if(!nome2) return;
    var data = {
      nome: nome2, orgao: resolveOrgao(form), responsavel: fd.get('responsavel')||'',
      status: fd.get('status')||'Sem status definido', resumo: (fd.get('resumo')||'').toString(),
      objetivo: (fd.get('objetivo')||'').toString(), autoridade: (fd.get('autoridade')||'').toString(),
      processoSei: (fd.get('processoSei')||'').toString(), trelloLink: (fd.get('trelloLink')||'').toString()
    };
    if(kind==='novo-projeto'){
      mutate(function(){ var newId = addProjeto(data); UI.view='projeto-detail'; UI.selectedProjetoId=newId; UI.projetoTab='geral'; });
      toast('Projeto criado.', 'ok');
    } else {
      var editId = form.dataset.id;
      mutate(function(){ updateProjeto(editId, data); });
      toast('Cadastro atualizado.', 'ok');
    }
    closeModal();
  } else if(kind==='novo-briefing' || kind==='editar-briefing'){
    var tema = (fd.get('tema')||'').toString().trim();
    if(!tema) return;
    var dataB = {
      tema: tema,
      dataSolicitacao: fromDateInputVal(fd.get('dataSolicitacao')),
      prazoEntrega: fromDateInputVal(fd.get('prazoEntrega')),
      detalhamento: (fd.get('detalhamento')||'').toString(),
      anexoLink: (fd.get('anexoLink')||'').toString().trim()
    };
    if(kind==='novo-briefing'){
      mutate(function(){ var newId = addBriefing(dataB); UI.view='briefing-detail'; UI.selectedBriefingId=newId; });
      toast('Briefing/estudo criado.', 'ok');
    } else {
      var editIdB = form.dataset.id;
      mutate(function(){ updateBriefing(editIdB, dataB); });
      toast('Cadastro atualizado.', 'ok');
    }
    closeModal();
  }
}

})();
</script>
